name: Harness CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Unit and integration tests
        run: go test ./...

      - name: Race detector
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Stage 0 compiler smoke benchmarks
        run: go test ./internal/harness/compiler -run '^$' -bench 'BenchmarkCompile(Linear1K|Linear10K|DAG100K)$' -benchtime=1x -benchmem

      - name: Stage 1 store smoke benchmarks
        run: go test ./internal/harness/store/sqlite -run '^$' -bench 'Benchmark(StateTransition|EventAppend)$' -benchtime=1x -benchmem

      - name: Stage 4 scheduler smoke benchmark
        run: go test ./internal/harness/scheduler -run '^$' -bench '^BenchmarkSchedulerNext10KReady$' -benchtime=1x -benchmem

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Windows tests
        run: go test ./...

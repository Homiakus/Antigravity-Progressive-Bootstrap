name: Harness CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify module graph is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Bridge JavaScript syntax
        run: |
          for file in extensions/agctl-antigravity-bridge/src/*.js; do node --check "$file"; done

      - name: Bridge contract tests
        run: node --test extensions/agctl-antigravity-bridge/test/*.test.js

      - name: Engineering process contract tests
        run: go test ./internal/engineering

      - name: Autonomous loop contract tests
        run: go test ./internal/loop

      - name: Hook lifecycle contract tests
        run: go test ./internal/hooks

      - name: Doctor integration contract tests
        run: go test ./internal/doctor

      - name: Unit and integration tests
        run: go test ./...

      - name: Race detector
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Provider demand estimator smoke benchmark
        run: go test ./internal/harness/provider/demand -run '^$' -bench '^BenchmarkEstimate1000Samples$' -benchtime=1x -benchmem

      - name: Provider session broker smoke benchmark
        run: go test ./internal/harness/provider/session -run '^$' -bench '^BenchmarkEvaluate100Sessions$' -benchtime=1x -benchmem

      - name: Provider atomic reservation smoke benchmark
        run: go test ./internal/harness/store/sqlite -run '^$' -bench '^BenchmarkAtomicProviderReservation10KActiveClaims$' -benchtime=1x -benchmem

      - name: Stage 0 compiler smoke benchmarks
        run: go test ./internal/harness/compiler -run '^$' -bench 'BenchmarkCompile(Linear1K|Linear10K|DAG100K)$' -benchtime=1x -benchmem

      - name: Stage 1 store smoke benchmarks
        run: go test ./internal/harness/store/sqlite -run '^$' -bench 'Benchmark(StateTransition|EventAppend)$' -benchtime=1x -benchmem

      - name: Stage 4 scheduler smoke benchmark
        run: go test ./internal/harness/scheduler -run '^$' -bench '^BenchmarkSchedulerNext10KReady$' -benchtime=1x -benchmem

      - name: Stage 7 retry storm smoke benchmark
        run: go test ./internal/harness/retry -run '^$' -bench '^BenchmarkRetryDecisionStorm100K$' -benchtime=1x -benchmem

      - name: Stage 8 durable wait smoke benchmark
        run: go test ./internal/harness/store/sqlite -run '^$' -bench '^BenchmarkDurableWaitDueTimerScan10K$' -benchtime=1x -benchmem

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bridge JavaScript syntax
        shell: pwsh
        run: Get-ChildItem extensions/agctl-antigravity-bridge/src/*.js | ForEach-Object { node --check $_.FullName }

      - name: Bridge contract tests
        run: node --test extensions/agctl-antigravity-bridge/test/*.test.js

      - name: Engineering process contract tests
        run: go test ./internal/engineering

      - name: Autonomous loop contract tests
        run: go test ./internal/loop

      - name: Hook lifecycle contract tests
        run: go test ./internal/hooks

      - name: Doctor integration contract tests
        run: go test ./internal/doctor

      - name: Windows tests
        run: go test ./...
